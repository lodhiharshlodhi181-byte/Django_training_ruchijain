
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 20% 20%, rgba(0, 238, 255, 0.18), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(140, 0, 255, 0.20), transparent 30%),
                linear-gradient(135deg, #080b18, #111936, #080b18);

            color: white;
        }

        /* Main Card */

        .container {
            width: 500px;
            padding: 50px 45px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);

            border-radius: 30px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);

            animation: appear 0.8s ease;
        }

        /* Heading */

        h1 {
            font-size: 42px;
            margin-bottom: 12px;

            background: linear-gradient(
                90deg,
                #00eaff,
                #ffffff,
                #a855f7
            );

            background-clip: text;
            color: transparent;

            letter-spacing: 1px;
        }

        /* Subtitle */

        .subtitle {
            color: rgba(255, 255, 255, 0.65);
            font-size: 16px;
            margin-bottom: 40px;
        }

        /* Forms */

        form {
            margin: 18px 0;
        }

        /* Buttons */

        input[type="submit"] {
            width: 100%;
            height: 58px;

            border: none;
            border-radius: 15px;

            color: white;

            font-size: 18px;
            font-weight: 600;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition: all 0.3s ease;
        }

        /* Register Button */

        .register-btn {
            background: linear-gradient(
                135deg,
                #00eaff,
                #0077ff
            );

            box-shadow:
                0 8px 25px rgba(0, 170, 255, 0.25);
        }

        .register-btn:hover {
            transform: translateY(-4px);

            box-shadow:
                0 0 25px rgba(0, 234, 255, 0.5),
                0 12px 30px rgba(0, 119, 255, 0.3);
        }

        /* Login Button */

        .login-btn {
            background: linear-gradient(
                135deg,
                #8b5cf6,
                #d946ef
            );

            box-shadow:
                0 8px 25px rgba(168, 85, 247, 0.25);
        }

        .login-btn:hover {
            transform: translateY(-4px);

            box-shadow:
                0 0 25px rgba(168, 85, 247, 0.5),
                0 12px 30px rgba(217, 70, 239, 0.3);
        }

        input[type="submit"]:active {
            transform: scale(0.97);
        }

        /* Small text */

        .bottom-text {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
        }

        /* Animation */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .container {
                width: 100%;
                padding: 40px 25px;
            }

            h1 {
                font-size: 34px;
            }

            input[type="submit"] {
                height: 55px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome</h1>

        <p class="subtitle">
            This is your home page. Choose an option below to continue.
        </p>


        <!-- Registration -->

        <form action="{% url 'studentreg' %}" method="post">

            {% csrf_token %}

            <input
                type="submit"
                value="Student Registration"
                class="register-btn"
            >

        </form>


        <!-- Login -->

        <form action="{% url 'login' %}" method="post">

            {% csrf_token %}

            <input
                type="submit"
                value="Login"
                class="login-btn"
            >

        </form>


        <p class="bottom-text">
            Secure • Simple • Fast
        </p>

    </div>

</body>

</html>
