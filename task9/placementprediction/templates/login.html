
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Segoe UI", Arial, sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(0, 234, 255, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(168, 85, 247, 0.20),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #080b18,
                    #111936,
                    #080b18
                );

            padding: 20px;
        }

        /* Login Card */

        .login-container {
            width: 430px;
            padding: 45px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.18);

            border-radius: 28px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);

            animation: showCard 0.7s ease;
        }

        /* Heading */

        h1 {
            font-size: 40px;
            margin-bottom: 8px;

            background: linear-gradient(
                90deg,
                #00eaff,
                #ffffff,
                #a855f7
            );

            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.55);
            font-size: 14px;
            margin-bottom: 35px;
        }

        /* Form */

        form {
            text-align: left;
        }

        /* Labels */

        label {
            display: block;

            margin-bottom: 8px;

            color: rgba(255, 255, 255, 0.8);

            font-size: 15px;
            font-weight: 600;
        }

        /* Input */

        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 52px;

            padding: 0 16px;

            margin-bottom: 22px;

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 12px;

            outline: none;

            background: rgba(0, 0, 0, 0.25);

            color: white;

            font-size: 16px;

            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        /* Input Focus */

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #00eaff;

            background: rgba(0, 234, 255, 0.06);

            box-shadow:
                0 0 0 2px rgba(0, 234, 255, 0.12),
                0 0 20px rgba(0, 234, 255, 0.15);
        }

        /* Login Button */

        input[type="submit"] {
            width: 100%;
            height: 55px;

            margin-top: 8px;

            border: none;
            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #00eaff,
                    #0077ff,
                    #8b5cf6
                );

            color: white;

            font-size: 17px;
            font-weight: 700;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition: all 0.3s ease;

            box-shadow:
                0 8px 25px rgba(0, 119, 255, 0.3);
        }

        input[type="submit"]:hover {
            transform: translateY(-3px);

            box-shadow:
                0 0 25px rgba(0, 234, 255, 0.4),
                0 12px 35px rgba(139, 92, 246, 0.3);
        }

        input[type="submit"]:active {
            transform: scale(0.97);
        }

        /* Error Message */

        .error {
            display: block;

            margin-top: 18px;

            padding: 10px;

            border-radius: 10px;

            background: rgba(255, 50, 80, 0.10);

            border: 1px solid rgba(255, 80, 100, 0.25);

            color: #ff6b81;

            font-size: 14px;
        }

        /* Create Account */

        .create-account {
            margin-top: 28px;

            padding-top: 22px;

            border-top: 1px solid rgba(255, 255, 255, 0.1);

            text-align: center;

            color: rgba(255, 255, 255, 0.55);

            font-size: 14px;
        }

        .create-account a {
            display: inline-block;

            margin-top: 8px;

            color: #00eaff;

            text-decoration: none;

            font-weight: 600;

            transition: 0.3s ease;
        }

        .create-account a:hover {
            color: #a855f7;

            text-shadow:
                0 0 12px rgba(0, 234, 255, 0.6);
        }

        /* Animation */

        @keyframes showCard {

            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        /* Mobile */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .login-container {
                width: 100%;
                padding: 35px 25px;
            }

            h1 {
                font-size: 34px;
            }

        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to continue to your account
        </p>


        <form action="{% url 'splacement' %}" method="post">

            {% csrf_token %}


            <!-- Username -->

            <label for="username">
                Username
            </label>

            <input
                type="text"
                name="username"
                id="username"
                placeholder="Enter your username"
                required
            >


            <!-- Password -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <!-- Login -->

            <input
                type="submit"
                value="Login"
            >


            <!-- Error -->

            {% if erg %}
                <span class="error">
                    {{ erg }}
                </span>
            {% endif %}

        </form>


        <!-- Registration -->

        <div class="create-account">

            Don't have an account?

            <br>

            <a href="{% url 'studentreg' %}">
                Create New User
            </a>

        </div>

    </div>

</body>

</html>
